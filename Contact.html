<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Henok Mulugeta" />
    <meta
      name="description"
      content="Contact information for The Little Tacos Shop"
    />
    <title>Contact Us - LTS</title>
    <link rel="stylesheet" href="css/style.css " />
    <link rel="icon" href="html5.png" type="image/x-icon" />
  </head>
  <body>
    <header class="header">
      <h1 class="header_h1">Little Taco Shop</h1>
      <nav class="header_nav">
        <ul class="header_ul">
          <li><a href="/">Home</a></li>
          <li><a href="/#menu">Menu</a></li>
          <li><a href="Hours.html">Hours</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <figure>
        <img
          src="img/food3.png"
          alt="Little tacos shop tacos"
          title="We Love Tacos"
          width="1000"
          height="667"
        />
        <figcaption class="offscreen">Little Taco Shop Tacos</figcaption>
      </figure>
    </section>

    <main class="main">
      <article class="main_article contact">
        <h2 class="contact_h2">Our Location</h2>
        <address>
          555 Taco Temptetion Lane, Suite T<br />
          Kansas City,MO 555-555-5555
          <br /><br />
          Phone: <a href="tel: +555-555-5555">555-555-5555</a>
        </address>
      </article>
      <hr />
      <article class="main_article">
        <h2>Our Contact Form</h2>
        <form
          action="https://httpbin.org/get"
          method="get"
          class="contact_form"
        >
          <fieldset class="contact_fieldset">
            <legend class="offscreen">Send Us A Message</legend>
            <p class="contact_p">
              <label class="contact_label" for="name">Name:</label>
              <input
                class="contact_input"
                type="text"
                id="name"
                placeholder="your name"
                required
                autofocus
              />
            </p>
            <p class="contact_p">
              <label class="contact_label" for="email">Email:</label>
              <input
                class="contact_input"
                type="email"
                id="email"
                placeholder="your email"
              />
            </p>
            <p class="contact_p">
              <label class="contact_label" for="message">Your Message:</label>
              <br />
              <textarea
                class="contact_textarea"
                name="message"
                id="meassage"
                cols="40"
                rows="11"
                placeholder="type your text here."
              ></textarea>
            </p>
          </fieldset>
          <button class="contact_button" type="submit">Send</button>
          <button class="contact_button" type="reset">Reset</button>
        </form>
      </article>
    </main>
    <footer class="footer">
      <p>
        <span class="nowrap">Copyright &copy;</span>
        <span class="nowrap">Little Taco Shop</span>
      </p>
    </footer>
  </body>
</html>
